name: paper-conformance

# The research paper's differential conformance campaign: wardowl's conformance kit
# (wardowl.testing) against current releases of the 14 vector stores and 7 authorization engines CI
# tests, for many seeds and for stress variants of the kit's generator, with every outcome recorded,
# failures and negative results included. By hand only: Actions > paper-conformance > Run workflow.
# What it tests and how to read the results: benchmarks/paper/CONFORMANCE.md.
#
# The servers are the images and versions of ci.yml's test job, started with its options. Each group
# of targets is one job; inside a job each target runs in its own process with its own time budget,
# so a store that does not start, or a driver that crashes, costs only its own rows. Every job
# uploads what it has, whatever happened, and the last job merges it into one summary.

on:
  # A push to this branch runs the campaign with the defaults below: a manual-only workflow cannot be
  # started until its file is on main, and the campaign should not need a change to main.
  push:
    branches: [paper/conformance-campaign]
  workflow_dispatch:
    inputs:
      seeds:
        description: Seeds per target and variant (seeds 0 to N-1)
        type: number
        default: 20
      examples:
        description: Corpora per seed for the default variant (the kit's own default is 25); the stress variants run a third of it, at least 2
        type: number
        default: 10
      variants:
        description: Variants to run, comma-separated, or all (see benchmarks/paper/CONFORMANCE.md)
        type: string
        default: all
      budget_minutes:
        description: Time budget per target, in minutes; runs it leaves out are reported as not started
        type: number
        default: 90
      pinecone:
        description: Also run Pinecone, the service, with the PINECONE_API_KEY secret (recorded as skipped without it)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: paper-conformance-${{ github.ref }}
  cancel-in-progress: false

env:
  CAMPAIGN: benchmarks/paper/conformance_campaign.py
  SEEDS: ${{ inputs.seeds || 20 }}
  EXAMPLES: ${{ inputs.examples || 10 }}
  VARIANTS: ${{ inputs.variants || 'all' }}
  BUDGET_MINUTES: ${{ inputs.budget_minutes || 90 }}

jobs:
  campaign:
    name: campaign (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: sql-and-kv
            targets: pgvector,redis,cassandra
          - group: search-engines
            targets: elasticsearch,opensearch,vespa
          - group: vector-dbs
            targets: qdrant,milvus,weaviate,mongodb
          - group: embedded
            targets: memory,chroma,lancedb,faiss
          - group: engines
            targets: metadata-acl,opa,opa-tenant,openfga,openfga-tenant,spicedb,spicedb-tenant,cerbos,cerbos-tenant,keto,cedar,cedar-tenant,casbin,casbin-tenant
    env:
      CAMPAIGN_GROUP: ${{ matrix.group }}
      CAMPAIGN_TARGETS: ${{ matrix.targets }}
      WARDOWL_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
      WARDOWL_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      WARDOWL_TEST_CASSANDRA_HOST: 127.0.0.1
      WARDOWL_TEST_ELASTICSEARCH_URL: http://127.0.0.1:9200
      WARDOWL_TEST_OPENSEARCH_URL: http://127.0.0.1:9201
      WARDOWL_TEST_VESPA_URL: http://127.0.0.1:8090
      WARDOWL_TEST_QDRANT_URL: http://127.0.0.1:6333
      WARDOWL_TEST_MILVUS_URL: http://127.0.0.1:19530
      WARDOWL_TEST_WEAVIATE_URL: http://127.0.0.1:8079
      WARDOWL_TEST_WEAVIATE_GRPC_PORT: "50051"
      WARDOWL_TEST_MONGODB_URL: mongodb://127.0.0.1:27017/?directConnection=true
      WARDOWL_TEST_OPA_URL: http://127.0.0.1:8181
      WARDOWL_TEST_OPENFGA_URL: http://127.0.0.1:8080
      WARDOWL_TEST_SPICEDB_URL: http://127.0.0.1:8443
      WARDOWL_TEST_SPICEDB_TOKEN: wo-test
      WARDOWL_TEST_CERBOS_URL: http://127.0.0.1:3592
      WARDOWL_CAMPAIGN_CERBOS_TENANT_URL: http://127.0.0.1:3593
      WARDOWL_TEST_KETO_URL: http://127.0.0.1:4466
      WARDOWL_TEST_KETO_WRITE_URL: http://127.0.0.1:4467
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      # ---- the servers: ci.yml's test job's images, versions and options; they boot while the rest installs

      - name: Start PostgreSQL with pgvector, Redis and Cassandra
        if: matrix.group == 'sql-and-kv'
        run: |
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=test pgvector/pgvector:pg17
          docker run -d --name redis -p 6379:6379 redis:8.10.2-alpine
          docker run -d --name cassandra -p 9042:9042 -e MAX_HEAP_SIZE=1G -e HEAP_NEWSIZE=200M cassandra:5.0.9
      - name: Start Elasticsearch, OpenSearch and Vespa
        if: matrix.group == 'search-engines'
        run: |
          docker run -d --name elasticsearch -p 9200:9200 -e discovery.type=single-node \
            -e xpack.security.enabled=false -e ES_JAVA_OPTS="-Xms512m -Xmx512m" \
            docker.elastic.co/elasticsearch/elasticsearch:9.5.5
          docker run -d --name opensearch -p 9201:9200 -e discovery.type=single-node \
            -e DISABLE_SECURITY_PLUGIN=true -e DISABLE_INSTALL_DEMO_CONFIG=true \
            -e OPENSEARCH_JAVA_OPTS="-Xms512m -Xmx512m" opensearchproject/opensearch:3.9.0
          docker run -d --name vespa --hostname vespa-container -p 8090:8080 -p 19071:19071 vespaengine/vespa:8.763.13
      - name: Start Qdrant, Milvus (standalone, embedded etcd, local storage), Weaviate and MongoDB Atlas Local
        if: matrix.group == 'vector-dbs'
        run: |
          docker run -d --name qdrant -p 6333:6333 qdrant/qdrant:v1.19.2
          mkdir -p "$RUNNER_TEMP/milvus"
          printf '%s\n' 'listen-client-urls: http://0.0.0.0:2379' 'advertise-client-urls: http://0.0.0.0:2379' \
            'quota-backend-bytes: 4294967296' 'auto-compaction-mode: revision' "auto-compaction-retention: '1000'" \
            > "$RUNNER_TEMP/milvus/embedEtcd.yaml"
          touch "$RUNNER_TEMP/milvus/user.yaml"
          docker run -d --name milvus --security-opt seccomp:unconfined -p 19530:19530 -p 9091:9091 \
            -e ETCD_USE_EMBED=true -e ETCD_DATA_DIR=/var/lib/milvus/etcd \
            -e ETCD_CONFIG_PATH=/milvus/configs/embedEtcd.yaml -e COMMON_STORAGETYPE=local -e DEPLOY_MODE=STANDALONE \
            -v "$RUNNER_TEMP/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml" \
            -v "$RUNNER_TEMP/milvus/user.yaml:/milvus/configs/user.yaml" \
            milvusdb/milvus:v3.0.2 milvus run standalone
          docker run -d --name weaviate -p 8079:8080 -p 50051:50051 -e AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true \
            -e PERSISTENCE_DATA_PATH=/var/lib/weaviate -e DEFAULT_VECTORIZER_MODULE=none -e CLUSTER_HOSTNAME=node1 \
            cr.weaviate.io/semitechnologies/weaviate:1.39.12
          docker run -d --name mongodb -p 27017:27017 mongodb/mongodb-atlas-local:8.0.30
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        if: matrix.group == 'engines'
        with: { version: 1.21.2 }
      - name: Start OPA, OpenFGA, SpiceDB, Cerbos (twice) and Ory Keto
        if: matrix.group == 'engines'
        run: |
          # OPA with the example policy, as CI starts it; the driver uploads the acceptance policy itself.
          opa run --server --addr=127.0.0.1:8181 examples/opa > "$RUNNER_TEMP/opa.log" 2>&1 &
          docker run -d --name openfga -p 8080:8080 openfga/openfga:v1.22.0 run
          docker run -d --name spicedb -p 8443:8443 authzed/spicedb:v1.56.2 serve \
            --grpc-preshared-key "$WARDOWL_TEST_SPICEDB_TOKEN" --http-enabled --datastore-engine memory
          # Cerbos reads its policies at startup: the example (metadata ACL) policy on 3592, as CI,
          # and the acceptance (tenant) policy on 3593.
          docker run -d --name cerbos -p 3592:3592 -v "$PWD/examples/cerbos/policies:/policies" \
            ghcr.io/cerbos/cerbos:0.56.0
          docker run -d --name cerbos-tenant -p 3593:3592 -v "$PWD/acceptance/policies/cerbos:/policies:ro" \
            ghcr.io/cerbos/cerbos:0.56.0
          docker run -d --name keto -p 4466:4466 -p 4467:4467 -v "$PWD/acceptance/policies/keto:/config:ro" \
            oryd/keto:v26.2.0 serve -c /config/keto.yml

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12", cache: pip }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.13.1", enable-cache: false }
      - name: Install from uv.lock, by hash
        run: |
          uv export --frozen --no-emit-project --all-extras --group integration --group examples -o "$RUNNER_TEMP/requirements.txt"
          pip install --require-hashes --no-deps -r "$RUNNER_TEMP/requirements.txt"
          pip install --require-hashes --no-deps -r .github/requirements/build.txt
          pip install --no-deps --no-build-isolation -e .
          python -c "import wardowl; print('wardowl', wardowl.__version__)"

      # A server that never answers is not fatal here: its targets record a setup error and the
      # others run.
      - name: Wait for PostgreSQL, Redis and Cassandra
        if: matrix.group == 'sql-and-kv'
        run: |
          ready() {
            local name=$1 tries=$2; shift 2
            for _ in $(seq 1 "$tries"); do "$@" > /dev/null 2>&1 && { echo "$name is ready"; return 0; }; sleep 2; done
            echo "::warning::$name did not answer; its targets will record a setup error"; docker logs --tail 50 "$name" || true
          }
          ready postgres 60 docker exec postgres pg_isready -U test
          ready redis 60 docker exec redis redis-cli ping
          ready cassandra 120 docker exec cassandra cqlsh -e 'SELECT release_version FROM system.local'
      - name: Wait for Elasticsearch and OpenSearch, and deploy the example Vespa application
        if: matrix.group == 'search-engines'
        run: |
          ready() {
            local name=$1 tries=$2; shift 2
            for _ in $(seq 1 "$tries"); do "$@" > /dev/null 2>&1 && { echo "$name is ready"; return 0; }; sleep 2; done
            echo "::warning::$name did not answer; its targets will record a setup error"; docker logs --tail 50 "$name" || true
            return 1
          }
          vespa_up() { curl -sf http://127.0.0.1:19071/state/v1/health | grep -q '"up"'; }
          probe=http://127.0.0.1:8090/document/v1/wardowl/wardowl/docid/ready
          vespa_feeds() { curl -sf -X POST -H 'Content-Type: application/json' -d '{"fields":{}}' "$probe"; }
          ready elasticsearch 90 curl -sf "$WARDOWL_TEST_ELASTICSEARCH_URL/_cluster/health?wait_for_status=yellow&timeout=2s" || true
          ready opensearch 90 curl -sf "$WARDOWL_TEST_OPENSEARCH_URL/_cluster/health?wait_for_status=yellow&timeout=2s" || true
          if ready vespa 60 vespa_up; then
            (cd examples/vespa/app && zip -qr - .) | curl -sf --header Content-Type:application/zip --data-binary @- \
              http://127.0.0.1:19071/application/v2/tenant/default/prepareandactivate \
              || echo "::warning::Vespa did not take the example application"
            if ready vespa 90 vespa_feeds; then curl -sf -X DELETE "$probe" || true; fi
          fi
      - name: Wait for Qdrant, Milvus, Weaviate and MongoDB
        if: matrix.group == 'vector-dbs'
        run: |
          ready() {
            local name=$1 tries=$2; shift 2
            for _ in $(seq 1 "$tries"); do "$@" > /dev/null 2>&1 && { echo "$name is ready"; return 0; }; sleep 2; done
            echo "::warning::$name did not answer; its targets will record a setup error"; docker logs --tail 50 "$name" || true
          }
          mongodb_healthy() { [ "$(docker inspect -f '{{.State.Health.Status}}' mongodb)" = healthy ]; }
          ready qdrant 60 curl -sf "$WARDOWL_TEST_QDRANT_URL/readyz"
          ready milvus 120 curl -sf http://127.0.0.1:9091/healthz
          ready weaviate 60 curl -sf "$WARDOWL_TEST_WEAVIATE_URL/v1/.well-known/ready"
          ready mongodb 120 mongodb_healthy
      - name: Wait for OPA, OpenFGA, SpiceDB, both Cerbos and Ory Keto
        if: matrix.group == 'engines'
        run: |
          ready() {
            local name=$1 tries=$2; shift 2
            for _ in $(seq 1 "$tries"); do "$@" > /dev/null 2>&1 && { echo "$name is ready"; return 0; }; sleep 2; done
            echo "::warning::$name did not answer; its targets will record a setup error"; docker logs --tail 50 "$name" || true
          }
          ready opa 30 curl -sf "$WARDOWL_TEST_OPA_URL/health"
          ready openfga 30 curl -sf "$WARDOWL_TEST_OPENFGA_URL/healthz"
          ready spicedb 30 curl -s -o /dev/null "$WARDOWL_TEST_SPICEDB_URL/"
          ready cerbos 30 curl -sf "$WARDOWL_TEST_CERBOS_URL/_cerbos/health"
          ready cerbos-tenant 30 curl -sf "$WARDOWL_CAMPAIGN_CERBOS_TENANT_URL/_cerbos/health"
          ready keto 30 curl -sf "$WARDOWL_TEST_KETO_URL/health/ready"

      - name: Run the campaign, one process per target
        run: |
          mkdir -p results
          # Each target gets the smaller of BUDGET_MINUTES and a fair share of what is left of 320
          # minutes, so the job ends inside its timeout; targets that finish early leave time to the rest.
          deadline=$(( $(date +%s) + 320 * 60 ))
          IFS=, read -r -a targets <<< "$CAMPAIGN_TARGETS"
          count=${#targets[@]}
          for i in "${!targets[@]}"; do
            target=${targets[$i]}
            echo "::group::$target"
            status=0
            python "$CAMPAIGN" run --targets "$target" --seeds "$SEEDS" --examples "$EXAMPLES" \
              --variants "$VARIANTS" --budget-minutes "$BUDGET_MINUTES" --group-deadline "$deadline" \
              --remaining "$((count - i))" --out results || status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error::$target: the driver stopped with exit status $status"
              printf '{"schema": 1, "type": "crash", "target": "%s", "group": "%s", "exit_status": %d}\n' \
                "$target" "$CAMPAIGN_GROUP" "$status" >> results/campaign.jsonl
            fi
            echo "::endgroup::"
          done
      - name: Summarize
        if: always()
        run: |
          if [ -f results/campaign.jsonl ]; then
            python "$CAMPAIGN" summarize results/campaign.jsonl --summary results/summary.md
            cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::no results were written"
          fi
      - name: Keep the servers' logs with the results
        if: always()
        run: |
          mkdir -p results/logs
          for name in $(docker ps -a --format '{{.Names}}'); do
            docker logs --tail 300 "$name" > "results/logs/$name.log" 2>&1 || true
          done
          if [ -f "$RUNNER_TEMP/opa.log" ]; then tail -n 300 "$RUNNER_TEMP/opa.log" > results/logs/opa.log; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: conformance-${{ matrix.group }}
          path: results/
          if-no-files-found: warn
          retention-days: 90
      # Findings (violations, refusals, errors inside runs) are results and leave the job green; a
      # target that could not run to its end turns it red.
      - name: Every target ran to its end
        run: python "$CAMPAIGN" check results/campaign.jsonl

  # Pinecone, the service, as ci.yml runs it: the only job that receives the Pinecone key, on a fresh
  # runner with only the Pinecone extra installed, from uv.lock by hash. Without the secret the
  # target is recorded as skipped and the job stays green.
  cloud:
    name: campaign (cloud)
    if: github.event_name == 'push' || inputs.pinecone
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CAMPAIGN_GROUP: cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.13.1", enable-cache: false }
      - name: Install from uv.lock, by hash
        run: |
          uv export --frozen --no-emit-project --extra pinecone -o "$RUNNER_TEMP/requirements.txt"
          pip install --require-hashes --no-deps -r "$RUNNER_TEMP/requirements.txt"
          pip install --require-hashes --no-deps -r .github/requirements/build.txt
          pip install --no-deps --no-build-isolation -e .
      - name: Pinecone, the service (skipped without the secret)
        env:
          WARDOWL_TEST_PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: |
          mkdir -p results
          status=0
          python "$CAMPAIGN" run --targets pinecone --seeds "$SEEDS" --examples "$EXAMPLES" --variants "$VARIANTS" \
            --budget-minutes "$BUDGET_MINUTES" --out results || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::pinecone: the driver stopped with exit status $status"
            printf '{"schema": 1, "type": "crash", "target": "pinecone", "group": "cloud", "exit_status": %d}\n' \
              "$status" >> results/campaign.jsonl
          fi
      - name: Summarize
        if: always()
        run: |
          if [ -f results/campaign.jsonl ]; then
            python "$CAMPAIGN" summarize results/campaign.jsonl --summary results/summary.md
            cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::no results were written"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: conformance-cloud
          path: results/
          if-no-files-found: warn
          retention-days: 90
      - name: The target ran to its end
        run: python "$CAMPAIGN" check results/campaign.jsonl

  summary:
    name: summary
    needs: [campaign, cloud]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: conformance-*
          path: parts
      - name: Merge every group's results into one file and one summary (the standard library only)
        run: |
          shopt -s nullglob
          files=(parts/*/campaign.jsonl)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no group uploaded results"; exit 1; fi
          mkdir -p merged
          python "$CAMPAIGN" summarize "${files[@]}" --merged merged/campaign.jsonl --summary merged/summary.md
          cat merged/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-summary
          path: merged/
          if-no-files-found: error
          retention-days: 90
